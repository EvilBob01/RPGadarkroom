# ═══════════════════════════════════════════════════════════════════════════════
# Epic Warpath — Space Theme Ruleset
# Tabletop game: Epic Warpath by Mantic Games
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
id             = "epic-warpath"
name           = "Epic Warpath"
theme          = "space"
tabletop_game  = "Epic Warpath by Mantic Games"
version        = "1.0"
description    = "Forge a galactic dominion. Mine asteroid fields, fabricate war machines, and marshal forces across the void."

# ─── UI Labels ────────────────────────────────────────────────────────────────
[ui]
empire_label         = "Dominion"
territory_label      = "Sector"
worker_label         = "Operative"
worker_label_plural  = "Operatives"
building_label       = "Installation"
building_label_plural = "Installations"
army_label           = "Battlegroup"
army_label_plural    = "Battlegroups"
scout_label          = "Recon Drone"
scout_label_plural   = "Recon Drones"
currency_label       = "Credits"

# ─── Balance ──────────────────────────────────────────────────────────────────
[balance]
action_points_per_day     = 100
ap_refresh_hour_utc       = 6        # 06:00 UTC daily reset
max_session_minutes       = 120      # hard cap on active play per day
starting_resources        = { ore = 100, rations = 50, fuel = 30 }
starting_action_points    = 50       # bonus AP on first login to a new campaign

# ─── Map ──────────────────────────────────────────────────────────────────────
[map]
chunk_size          = 16             # tiles per chunk edge (16×16 = 256 tiles)
starting_chunk_radius = 2            # chunks revealed around homeworld at start
base_vision_range   = 3             # tiles visible from any owned building
fog_decay_turns     = 0             # 0 = permanent once revealed; >0 = re-fogs after N turns

[[map.biomes]]
id       = "void"
name     = "Deep Void"
weight   = 35
color    = "#0a0a1a"
passable = true
resource_bonus = {}

[[map.biomes]]
id       = "asteroid_field"
name     = "Asteroid Field"
weight   = 25
color    = "#2a2a3e"
passable = true
resource_bonus = { ore = 1.5 }

[[map.biomes]]
id       = "nebula"
name     = "Nebula Cloud"
weight   = 15
color    = "#1a0a2e"
passable = true
resource_bonus = { fuel = 1.25 }

[[map.biomes]]
id       = "debris_field"
name     = "Debris Field"
weight   = 10
color    = "#3a2a2a"
passable = true
resource_bonus = { scrap_alloy = 1.5 }

[[map.biomes]]
id       = "stable_orbit"
name     = "Stable Orbit"
weight   = 10
color    = "#0a1a2a"
passable = true
resource_bonus = {}

[[map.biomes]]
id       = "planet"
name     = "Planet"
weight   = 5
color    = "#1a3a1a"
passable = false
resource_bonus = { ore = 2.0, bio_matter = 2.0 }

# ─── Landmarks ────────────────────────────────────────────────────────────────
[[map.landmarks]]
id         = "derelict_station"
name       = "Derelict Station"
min_radius = 5
max_radius = 25
rarity     = 0.04
loot_table = "derelict"

[[map.landmarks]]
id         = "ore_deposit"
name       = "Rich Ore Deposit"
min_radius = 3
max_radius = 20
rarity     = 0.06
loot_table = "ore_deposit"

[[map.landmarks]]
id         = "alien_ruins"
name       = "Alien Ruins"
min_radius = 10
max_radius = 30
rarity     = 0.02
loot_table = "alien_ruins"

[[map.landmarks]]
id         = "fuel_cloud"
name       = "Fuel Cloud"
min_radius = 4
max_radius = 20
rarity     = 0.05
loot_table = "fuel_cloud"

