# ─── Factions ─────────────────────────────────────────────────────────────────

[[factions]]
id          = "enforcers"
name        = "Enforcers"
description = "The iron fist of the GCPS. Disciplined shock troops and heavy armour."
flavor      = "Order. Compliance. Enforcement."
[factions.starting_bonus]
munitions   = 50
alloy_plates = 20
[factions.stat_modifiers]
industry_speed = 1.1

[[factions]]
id          = "plague"
name        = "The Plague"
description = "A viral biomechanical horror that consumes and corrupts. Bio-matter flows freely."
flavor      = "Consume. Evolve. Spread."
[factions.starting_bonus]
bio_matter  = 100
rations     = 30
[factions.stat_modifiers]
bio_production = 1.25

[[factions]]
id          = "forge_fathers"
name        = "Forge Fathers"
description = "Ancient and stubborn space dwarves. Unmatched in industry and endurance."
flavor      = "Craft. Endure. Prevail."
[factions.starting_bonus]
ore         = 150
alloy_plates = 30
[factions.stat_modifiers]
smelting_speed = 1.2

[[factions]]
id          = "asterians"
name        = "Asterians"
description = "Enigmatic ancient beings who fight through expendable robotic proxies."
flavor      = "Observe. Calculate. Act."
[factions.starting_bonus]
neural_chip = 5
plasma_cell = 20
[factions.stat_modifiers]
operative_efficiency = 1.15

[[factions]]
id          = "marauders"
name        = "Marauders"
description = "Savage and opportunistic raiders. Fast, brutal, and unpredictable."
flavor      = "Raid. Plunder. Survive."
[factions.starting_bonus]
scrap_alloy = 80
munitions   = 40
[factions.stat_modifiers]
movement_speed = 1.2

[[factions]]
id          = "veer_myn"
name        = "Veer-myn"
description = "Lurking beneath the infrastructure of civilisation, they breed in the dark."
flavor      = "Breed. Scurry. Swarm."
[factions.starting_bonus]
rations     = 100
bio_matter  = 50
[factions.stat_modifiers]
population_growth = 1.3

