# ─── Buildings ────────────────────────────────────────────────────────────────

[[buildings]]
id          = "hunting_snare"
name        = "Hunting Snare"
category    = "extractor"
description = "Simple traps set in the jungle to catch animals for hides and provisions."
max_count   = 10
vision_bonus = 1
[buildings.cost]
timber = 10
[buildings.worker_slot]
operative_type = "trapper"
[buildings.income_per_worker]
hides = 0.4
provisions = 0.3

[[buildings]]
id          = "dwelling"
name        = "Dwelling"
category    = "housing"
description = "Basic settler housing that increases your colony's population capacity."
max_count   = 20
population_bonus = 4
[buildings.cost]
timber = 15

[[buildings]]
id          = "great_hall"
name        = "Great Hall"
category    = "command"
description = "The heart of your colony. Recruits colonists and improves overall coordination."
max_count   = 1
[buildings.cost]
timber = 200
planks = 10
provisions = 100

[[buildings]]
id          = "trading_post"
name        = "Trading Post"
category    = "commerce"
description = "Enables trade and exchange of goods with other colonies and merchant vessels."
max_count   = 1
[buildings.cost]
timber = 400
planks = 20
provisions = 200

[[buildings]]
id          = "tannery"
name        = "Tannery"
category    = "industry"
description = "Converts raw hides into usable leather for armour and equipment."
max_count   = 3
[buildings.cost]
timber = 200
planks = 5
[buildings.worker_slot]
operative_type = "tanner"
[buildings.income_per_worker]
leather = 0.4

[[buildings]]
id          = "smokehouse"
name        = "Smokehouse"
category    = "food"
description = "Smokes and salts fresh provisions for long-lasting rations."
max_count   = 3
[buildings.cost]
timber = 100
planks = 5
[buildings.worker_slot]
operative_type = "salter"
[buildings.income_per_worker]
salted_provisions = 0.35

[[buildings]]
id          = "workshop"
name        = "Workshop"
category    = "industry"
description = "General crafting workshop producing tools, rope, sailcloth and equipment."
max_count   = 3
[buildings.cost]
timber = 300
planks = 15
[buildings.worker_slot]
operative_type = "craftsman"
[buildings.income_per_worker]
rope = 0.3
sailcloth = 0.2
iron_goods = 0.15

[[buildings]]
id          = "forge"
name        = "Forge"
category    = "industry"
description = "Smelts iron ore into iron goods, cannon shot, and weapon components."
max_count   = 3
[buildings.cost]
timber = 400
planks = 20
[buildings.worker_slot]
operative_type = "smith"
[buildings.income_per_worker]
iron_goods = 0.4
cannon_shot = 0.15

[[buildings]]
id          = "powder_mill"
name        = "Powder Mill"
category    = "military_industry"
description = "Carefully mixes sulphur, charcoal, and saltpeter into black powder."
max_count   = 2
[buildings.cost]
timber = 500
planks = 30
iron_goods = 10
[buildings.worker_slot]
operative_type = "powder_maker"
[buildings.income_per_worker]
gunpowder = 0.3

[[buildings]]
id          = "shipyard"
name        = "Shipyard"
category    = "military_industry"
