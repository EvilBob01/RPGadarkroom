# ═══════════════════════════════════════════════════════════════════════════════
# Blood & Plunder — Age of Sail / Fantasy Theme Ruleset
# Tabletop game: Blood & Plunder by Firelock Games
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
id             = "blood-and-plunder"
name           = "Blood & Plunder"
theme          = "fantasy"
tabletop_game  = "Blood & Plunder by Firelock Games"
version        = "1.0"
description    = "Build a colonial empire across treacherous seas. Fell timber, forge cannon, and send your warships to claim glory."

# ─── UI Labels ────────────────────────────────────────────────────────────────
[ui]
empire_label          = "Colony"
territory_label       = "Province"
worker_label          = "Colonist"
worker_label_plural   = "Colonists"
building_label        = "Structure"
building_label_plural = "Structures"
army_label            = "Warband"
army_label_plural     = "Warbands"
scout_label           = "Scout"
scout_label_plural    = "Scouts"
currency_label        = "Pieces of Eight"

# ─── Balance ──────────────────────────────────────────────────────────────────
[balance]
action_points_per_day     = 100
ap_refresh_hour_utc       = 6
max_session_minutes       = 120
starting_resources        = { timber = 100, provisions = 50, trade_goods = 20 }
starting_action_points    = 50

# ─── Map ──────────────────────────────────────────────────────────────────────
[map]
chunk_size            = 16
starting_chunk_radius = 2
base_vision_range     = 3
fog_decay_turns       = 0

[[map.biomes]]
id       = "open_sea"
name     = "Open Sea"
weight   = 40
color    = "#1a3a6a"
passable = true
resource_bonus = {}

[[map.biomes]]
id       = "coastal_waters"
name     = "Coastal Waters"
weight   = 20
color    = "#2a5a8a"
passable = true
resource_bonus = { fish = 1.5 }

[[map.biomes]]
id       = "jungle"
name     = "Jungle"
weight   = 15
color    = "#1a4a1a"
passable = true
resource_bonus = { timber = 1.75, hides = 1.5 }

[[map.biomes]]
id       = "savanna"
name     = "Savanna"
weight   = 10
color    = "#6a5a2a"
passable = true
resource_bonus = { hides = 1.25, provisions = 1.25 }

[[map.biomes]]
id       = "swamp"
name     = "Swamp"
weight   = 8
color    = "#3a4a2a"
passable = true
resource_bonus = { timber = 1.25 }

[[map.biomes]]
id       = "island"
name     = "Island"
weight   = 7
color    = "#6a7a4a"
passable = true
resource_bonus = { timber = 1.5, trade_goods = 1.5 }

# ─── Landmarks ────────────────────────────────────────────────────────────────
[[map.landmarks]]
id         = "abandoned_settlement"
name       = "Abandoned Settlement"
min_radius = 5
max_radius = 25
rarity     = 0.04
loot_table = "settlement"

[[map.landmarks]]
id         = "iron_vein"
name       = "Iron Vein"
min_radius = 3
max_radius = 20
rarity     = 0.06
loot_table = "iron_vein"

[[map.landmarks]]
id         = "native_village"
name       = "Native Village"
min_radius = 5
max_radius = 25
rarity     = 0.05
loot_table = "native_village"

[[map.landmarks]]
id         = "hidden_harbour"
name       = "Hidden Harbour"
min_radius = 4
max_radius = 20
rarity     = 0.04
loot_table = "harbour"

[[map.landmarks]]
id         = "spanish_wreck"
name       = "Spanish Wreck"
min_radius = 8
max_radius = 30
rarity     = 0.02
loot_table = "wreck"

