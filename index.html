<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campaign Dark Room</title>
  <meta name="description" content="A multiplayer tabletop campaign management game"/>

  <!-- Campaign UI styles (new) -->
  <link rel="stylesheet" href="css/campaign.css"/>

  <!-- Original A Dark Room styles (kept, hidden behind campaign UI for now) -->
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/room.css"/>
  <link rel="stylesheet" href="css/outside.css"/>
  <link rel="stylesheet" href="css/path.css"/>
  <link rel="stylesheet" href="css/world.css"/>
  <link rel="stylesheet" href="css/ship.css"/>
  <link rel="stylesheet" href="css/space.css"/>
  <link rel="stylesheet" href="css/fabricator.css"/>
</head>
<body>

  <!-- ── Loading splash ─────────────────────────────────────────────────── -->
  <div id="c-loading">loading…</div>

  <!-- ── Campaign App ───────────────────────────────────────────────────── -->
  <div id="campaign-app">

    <!-- Auth screen -->
    <div id="auth-screen"   class="c-screen"></div>

    <!-- Campaign lobby -->
    <div id="lobby-screen"  class="c-screen"></div>

    <!-- Empire dashboard -->
    <div id="empire-screen" class="c-screen"></div>

  </div>

  <!-- ── Original A Dark Room (hidden — will be integrated in a later phase) -->
  <div id="adr-wrapper" style="display:none">
    <div id="wrapper">
      <div id="saveNotify">saved.</div>
      <div id="content">
        <div id="outerSlider">
          <div id="main">
            <div id="header"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Campaign scripts (ES modules) ──────────────────────────────────── -->
  <script type="module" src="script/campaign/main.js"></script>

</body>
</html>
